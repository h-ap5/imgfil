<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="사진을 브라우저 안에서 Y2K, 구형 아이폰, 아날로그 TV 감성으로 바꾸는 무료 이미지 필터 도구"
    />
    <meta name="theme-color" content="#171827" />
    <title>FILTER_2000.exe — 레트로 이미지 필터</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#editor">편집기로 바로가기</a>

    <div class="page-shell">
      <header class="site-header" aria-label="사이트 헤더">
        <a class="brand" href="#" aria-label="FILTER 2000 홈">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M4 5h16v14H4zM7 8h4v4H7zm7 0h3m-3 3h3M7 16h10" />
            </svg>
          </span>
          <span>FILTER_2000.exe</span>
        </a>
        <div class="privacy-badge">
          <span class="status-light" aria-hidden="true"></span>
          사진은 기기 밖으로 나가지 않아요
        </div>
      </header>

      <main id="editor" class="editor-window" tabindex="-1">
        <div class="title-bar">
          <div class="title-path">
            <span class="tiny-disk" aria-hidden="true"></span>
            A:\MEMORY\FILTERS
          </div>
          <div class="window-controls" aria-hidden="true">
            <span>_</span><span>□</span><span>×</span>
          </div>
        </div>

        <div class="workspace">
          <section class="preview-panel" aria-labelledby="preview-heading">
            <div class="panel-heading">
              <h1 id="preview-heading">PREVIEW</h1>
              <button id="reset-button" class="icon-button" type="button" disabled aria-label="처음부터 다시 하기">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 4v6h6M5.5 9A7 7 0 1 1 5 16" />
                </svg>
              </button>
            </div>

            <div id="drop-zone" class="canvas-frame" role="button" tabindex="0" aria-label="사진을 선택하거나 여기에 놓기">
              <canvas id="preview-canvas" aria-label="필터 적용 이미지 미리보기"></canvas>
              <div id="empty-state" class="empty-state">
                <div class="empty-graphic" aria-hidden="true">
                  <div class="empty-sun"></div>
                  <div class="empty-mountain mountain-one"></div>
                  <div class="empty-mountain mountain-two"></div>
                  <div class="empty-spark spark-one">✦</div>
                  <div class="empty-spark spark-two">✦</div>
                </div>
                <h2>사진을 불러오세요</h2>
                <p>JPG · PNG · WEBP</p>
                <button id="upload-button" class="button button-primary" type="button">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 16V4m0 0L7 9m5-5 5 5M5 14v5h14v-5" />
                  </svg>
                  사진 불러오기
                </button>
              </div>
              <div id="processing-indicator" class="processing-indicator" hidden>
                <span></span> PROCESSING...
              </div>
            </div>

            <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp" hidden />

            <div class="preview-toolbar">
              <div id="file-meta" class="file-meta" aria-live="polite">이미지 대기 중</div>
              <button id="compare-button" class="button button-dark" type="button" disabled aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3v18M5 5h14v14H5z" />
                </svg>
                누르고 원본 보기
              </button>
            </div>
          </section>

          <aside class="control-panel" aria-label="필터 설정">
            <section class="control-section" aria-labelledby="filter-title">
              <div class="section-title-row">
                <h2 id="filter-title">필터</h2>
              </div>

              <div class="filter-list" role="radiogroup" aria-label="필터 프리셋">
                <button class="filter-card is-active" type="button" role="radio" aria-checked="true" data-filter="softcam">
                  <span class="filter-swatch swatch-softcam" aria-hidden="true"></span>
                  <span class="filter-copy"><strong>흐릿한 아이폰</strong><small>soft / hazy / 2011</small></span>
                  <span class="filter-index">01</span>
                </button>
                <button class="filter-card" type="button" role="radio" aria-checked="false" data-filter="y2k">
                  <span class="filter-swatch swatch-y2k" aria-hidden="true"></span>
                  <span class="filter-copy"><strong>Y2K 앰버</strong><small>amber / flash / y2k</small></span>
                  <span class="filter-index">02</span>
                </button>
                <button class="filter-card" type="button" role="radio" aria-checked="false" data-filter="analog">
                  <span class="filter-swatch swatch-analog" aria-hidden="true"></span>
                  <span class="filter-copy"><strong>아날로그 TV</strong><small>scanline / noise / rgb</small></span>
                  <span class="filter-index">03</span>
                </button>
                <button class="filter-card" type="button" role="radio" aria-checked="false" data-filter="disposable">
                  <span class="filter-swatch swatch-disposable" aria-hidden="true"></span>
                  <span class="filter-copy"><strong>일회용 플래시</strong><small>flash / grain / night</small></span>
                  <span class="filter-index">04</span>
                </button>
                <button class="filter-card" type="button" role="radio" aria-checked="false" data-filter="ccd">
                  <span class="filter-swatch swatch-ccd" aria-hidden="true"></span>
                  <span class="filter-copy"><strong>블루 CCD</strong><small>cool / bloom / digicam</small></span>
                  <span class="filter-index">05</span>
                </button>
                <button class="filter-card" type="button" role="radio" aria-checked="false" data-filter="liquify">
                  <span class="filter-swatch swatch-liquify" aria-hidden="true"></span>
                  <span class="filter-copy"><strong>네온 용해</strong><small>liquid / warp / neon</small></span>
                  <span class="filter-index">06</span>
                </button>
                <button class="filter-card" type="button" role="radio" aria-checked="false" data-filter="signal">
                  <span class="filter-swatch swatch-signal" aria-hidden="true"></span>
                  <span class="filter-copy"><strong>신호 붕괴</strong><small>rgb / tear / dropout</small></span>
                  <span class="filter-index">07</span>
                </button>
                <button class="filter-card" type="button" role="radio" aria-checked="false" data-filter="frameecho">
                  <span class="filter-swatch swatch-frameecho" aria-hidden="true"></span>
                  <span class="filter-copy"><strong>프레임 잔상</strong><small>echo / codec / smear</small></span>
                  <span class="filter-index">08</span>
                </button>
                <button class="filter-card" type="button" role="radio" aria-checked="false" data-filter="prism">
                  <span class="filter-swatch swatch-prism" aria-hidden="true"></span>
                  <span class="filter-copy"><strong>프리즘 잔상</strong><small>prism / echo / glow</small></span>
                  <span class="filter-index">09</span>
                </button>
                <button class="filter-card" type="button" role="radio" aria-checked="false" data-filter="thermal">
                  <span class="filter-swatch swatch-thermal" aria-hidden="true"></span>
                  <span class="filter-copy"><strong>열화상 블룸</strong><small>thermal / false color</small></span>
                  <span class="filter-index">10</span>
                </button>
                <button class="filter-card" type="button" role="radio" aria-checked="false" data-filter="xerox">
                  <span class="filter-swatch swatch-xerox" aria-hidden="true"></span>
                  <span class="filter-copy"><strong>복사기 레이브</strong><small>xerox / toner / acid</small></span>
                  <span class="filter-index">11</span>
                </button>
                <button class="filter-card" type="button" role="radio" aria-checked="false" data-filter="riso">
                  <span class="filter-swatch swatch-riso" aria-hidden="true"></span>
                  <span class="filter-copy"><strong>리소 어긋남</strong><small>riso / halftone / ink</small></span>
                  <span class="filter-index">12</span>
                </button>
                <button class="filter-card" type="button" role="radio" aria-checked="false" data-filter="comic">
                  <span class="filter-swatch swatch-comic" aria-hidden="true"></span>
                  <span class="filter-copy"><strong>셀 만화</strong><small>toon / ink / cel shade</small></span>
                  <span class="filter-index">13</span>
                </button>
                <button class="filter-card" type="button" role="radio" aria-checked="false" data-filter="holo">
                  <span class="filter-swatch swatch-holo" aria-hidden="true"></span>
                  <span class="filter-copy"><strong>홀로 드림</strong><small>pearl / haze / dream</small></span>
                  <span class="filter-index">14</span>
                </button>
              </div>
            </section>

            <section class="control-section sticker-section" aria-labelledby="sticker-title">
              <div class="section-title-row sticker-title-row">
                <h2 id="sticker-title">스티커</h2>
                <div class="sticker-actions">
                  <button id="upload-sticker" type="button" disabled>내 이미지</button>
                  <button id="random-stickers" type="button" disabled>랜덤</button>
                  <button id="clear-stickers" type="button" disabled>전체삭제</button>
                </div>
              </div>

              <input id="sticker-file-input" type="file" accept="image/png,image/webp,image/jpeg,image/svg+xml" hidden />

              <div class="sticker-tabs" role="tablist" aria-label="스티커 팩">
                <button class="is-selected" type="button" role="tab" aria-selected="true" data-sticker-group="holo">홀로</button>
                <button type="button" role="tab" aria-selected="false" data-sticker-group="pixel">픽셀</button>
                <button type="button" role="tab" aria-selected="false" data-sticker-group="custom">내꺼</button>
              </div>
              <div id="sticker-tray" class="sticker-tray" aria-label="스티커 목록"></div>

              <div id="sticker-tools" class="sticker-tools" hidden>
                <label class="mini-range" for="sticker-size">
                  <span>크기 <output id="sticker-size-value">100%</output></span>
                  <input id="sticker-size" type="range" min="45" max="190" value="100" />
                </label>
                <label class="mini-range" for="sticker-rotation">
                  <span>회전 <output id="sticker-rotation-value">0°</output></span>
                  <input id="sticker-rotation" type="range" min="-180" max="180" value="0" />
                </label>
                <button id="delete-sticker" class="sticker-delete" type="button">선택 삭제</button>
              </div>
            </section>

            <section class="control-section settings-section" aria-labelledby="settings-title">
              <h2 id="settings-title">조정</h2>

              <label class="range-control" for="strength-range">
                <span><strong>필터 강도</strong><output id="strength-value">72%</output></span>
                <input id="strength-range" type="range" min="0" max="100" value="72" />
              </label>

              <label class="range-control" for="grain-range">
                <span><strong>입자감</strong><output id="grain-value">24%</output></span>
                <input id="grain-range" type="range" min="0" max="100" value="24" />
              </label>

              <fieldset class="ratio-control">
                <legend>사진 비율</legend>
                <div class="segmented-control">
                  <button class="is-selected" type="button" data-ratio="original" aria-pressed="true">원본</button>
                  <button type="button" data-ratio="1:1" aria-pressed="false">1:1</button>
                  <button type="button" data-ratio="4:5" aria-pressed="false">4:5</button>
                </div>
              </fieldset>

              <label class="toggle-row" for="date-toggle">
                <span><strong>날짜 스탬프</strong><small>사진 아래에 오늘 날짜 새기기</small></span>
                <span class="switch"><input id="date-toggle" type="checkbox" /><span aria-hidden="true"></span></span>
              </label>
            </section>

            <button id="download-button" class="button button-download" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 4v11m0 0 5-5m-5 5-5-5M5 19h14" />
              </svg>
              PNG로 저장하기
            </button>
            <p class="local-note">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10V8a6 6 0 0 1 12 0v2M5 10h14v10H5z" /></svg>
              모든 편집은 이 브라우저 안에서만 처리됩니다.
            </p>
          </aside>
        </div>

        <div class="status-bar" aria-hidden="true">
          <span id="status-size">0 × 0 PX</span>
        </div>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="stickers.js"></script>
    <script src="app.js"></script>
  </body>
</html>
